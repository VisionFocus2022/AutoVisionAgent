[pytest]
# pytest 配置（W3-T4 自兄弟树门禁回归，按本树包集合适配）
#
# 覆盖率门禁（棘轮策略）：
#   - 门禁包 = 11 个非 GUI 发布包 + gui（W8 起纳入分母：gui 覆盖由离屏
#     单测 + UIA 真窗 e2e 双承担；UIA 仍默认排除，见下方）
#   - fail-under = W9 全量实测地板 82（实测 82.95%，2026-08-17，分母含 gui；
#     W8 为 76.02%。棘轮：只升不降，升前须补覆盖。当前尾巴：shell 83%、
#     tasks_ui 82%、predict 85%（openpyxl 缺失分支）、theme/thread_bridge 杂线）
#   - 快跑：pytest --no-cov tests/test_xxx.py
#   - UIA 真窗测试默认排除（需桌面会话 + 打包 exe，发版检查单手动执行）：
#     .venv/Scripts/python.exe -m pytest tests/uia -o addopts=
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    --strict-markers
    --ignore=tests/uia
    --cov=core
    --cov=dataset
    --cov=project
    --cov=models
    --cov=labeling
    --cov=training
    --cov=inference
    --cov=evaluation
    --cov=exporter
    --cov=industrial_vision_platform
    --cov=serving
    --cov=gui
    --cov-report=term-missing
    --cov-fail-under=82

markers =
    unit: 单元测试（快速、无外部依赖）
    e2e: 端到端测试（可能需要 GPU / 模型权重）
    integration: 集成测试（需要实际模型或网络）
    gpu: 需要 GPU 的测试
    uia: UI 自动化测试（真窗 + 打包 exe；默认 --ignore，手动运行见上方注释）

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
