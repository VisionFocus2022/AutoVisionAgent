[pytest]
# pytest 配置（W3-T4 自兄弟树门禁回归，按本树包集合适配）
#
# 覆盖率门禁（棘轮策略）：
#   - 门禁包 = 本树 11 个非 GUI 发布包（gui 的覆盖由 UIA 真窗 e2e 承担，
#     无头环境不可跑，不纳入分母——与兄弟树 2026-07-03 de-gate IVP 同理）
#   - fail-under = W3 全量实测地板 64（实测 64.19%，2026-08-16；棘轮：只升不
#     不降，升前须补覆盖。⚠️ 余量 0.19 极薄——删测试/加 skip 前先补低覆盖模块，
#     首要目标：training/generic_trainer 13%、serving/server 23%）
#   - 快跑：pytest --no-cov tests/test_xxx.py
#   - UIA 真窗测试默认排除（需桌面会话 + 打包 exe，发版检查单手动执行）：
#     .venv/Scripts/python.exe -m pytest tests/uia -o addopts=
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    --strict-markers
    --ignore=tests/uia
    --cov=core
    --cov=dataset
    --cov=project
    --cov=models
    --cov=labeling
    --cov=training
    --cov=inference
    --cov=evaluation
    --cov=exporter
    --cov=industrial_vision_platform
    --cov=serving
    --cov-report=term-missing
    --cov-fail-under=64

markers =
    unit: 单元测试（快速、无外部依赖）
    e2e: 端到端测试（可能需要 GPU / 模型权重）
    integration: 集成测试（需要实际模型或网络）
    gpu: 需要 GPU 的测试
    uia: UI 自动化测试（真窗 + 打包 exe；默认 --ignore，手动运行见上方注释）

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
