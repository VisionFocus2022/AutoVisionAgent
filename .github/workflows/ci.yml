# CI（架构审查 P2-26 落地；W18 v3 P2-4 升级；W56·v7 P2-2 增补 lint job）
# ——与本地 .venv 构建方式一致的全量门禁；gitee/github 双远程已接入。
#
# 说明：
# - requirements.lock.txt 第 1 行已含 --extra-index-url cu121 索引（W12 P1-6 落地）；
#   下方 CLI 同名参数为冗余双保险，保留无害。
# - 门禁不另传覆盖率参数：fail-under=92 由 pytest.ini addopts 生效。
# - windows-latest 无交互桌面：QT_QPA_PLATFORM=offscreen + tests/conftest.py
#   无头兜底（P2-27）双保险；tests/uia 真窗测试默认 --ignore，不在 CI 跑。
# - dotnet-test job：windows-latest 自带 .NET 8 SDK（无需 setup-dotnet）；
#   dotnet test serving/dotnet_client 与本地 cd serving/dotnet_client 后
#   dotnet test 等效（该目录恰含一个 csproj，Tests/ 子目录同在其中）。
# - lint job（W56·v7 P2-2）：ruff 棘轮与 .qoder 命名规约的机器兜底——
#   此前 check-gate.sh 纯本地人工执行；ruff 基线=0 时违规即 exit 非 0，
#   与本地 scripts/check-gate.sh 第 2/3 段同口径（本地脚本另有 PYTHON
#   参数化，可在 CI 用 PYTHON=python 复用）。
name: CI

on:
  push:
  pull_request:

jobs:
  # W56·v7 P2-2：轻量 lint job——不装 torch 大依赖，秒级反馈
  lint:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ruff 棘轮（基线 0，违规即红）
        run: |
          python -m pip install ruff
          python -m ruff check . --output-format=concise

      - name: .qoder 命名规约（R00，与本地 check-naming.sh 同口径）
        shell: bash
        run: bash scripts/check-naming.sh

      # L8（2026-10-05 一轮审查）：proto 生成物漂移对账——重生成到临时
      # 目录与入库 pb2 diff，proto 改动而未跑 gen_proto.py 即红（防人肉
      # 步骤漂移）。轻量（grpcio-tools 小包），适合放 lint job 秒级反馈。
      - name: proto 生成物对账（gen_proto --check）
        run: |
          python -m pip install grpcio-tools
          python scripts/gen_proto.py --check

  # python 门禁 job：lock 钉 torch==2.5.1+cu121——换 cpu 索引装不出带 +cu121
  # 本地标签的轮子（须同步把 lock 的 torch/torchvision 行改成 PyPI 版本号才行），
  # 故保留 cu121 索引；cu121 轮子下载较大（约 2.5GB，最大耗时项），已开
  # setup-python 的 pip cache 缓解（缓存键挂 requirements.lock.txt 哈希，而非
  # 默认 glob 命中的根目录松散 requirements.txt——安装真源是锁文件）。
  test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python 3.12（与本地 .venv 同小版本线，实测 3.12.9）
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          # 缓存键挂锁文件：仅动 lock 时缓存键随之翻转，不与安装真源脱钩。
          cache-dependency-path: requirements.lock.txt

      - name: 安装依赖（全量 lock 锁装，与本地 .venv 构建方式一致）
        run: python -m pip install -r requirements.lock.txt --extra-index-url https://download.pytorch.org/whl/cu121

      - name: 门禁（pytest.ini 覆盖率 fail-under=92 生效）
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

      # M16（2026-10-05 一轮审查 Tessa 建议）：per-package 覆盖率棘轮地板
      # ——全局 92% 存在分母稀释（core 单独 91.2% 被抬过线），地板只升
      # 不降（scripts/coverage_floors.py 的 _FLOORS 表），低于地板即红。
      - name: 覆盖率棘轮地板（per-package floors）
        run: python scripts/coverage_floors.py --from-existing

  # C# 共享库门禁（W18 簇 F / FR-007）：与 python 门禁并行、互不阻塞，失败可独立定位。
  dotnet-test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: C# 测试（等效本地 cd serving/dotnet_client 后 dotnet test）
        run: dotnet test serving/dotnet_client
