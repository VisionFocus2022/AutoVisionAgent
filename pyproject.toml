[project]
name = "autovisionagent"
version = "2.1.0"
description = "AutoVisionAgent — 工业视觉智能平台"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
# .workflow/ = 各波次过程产物（临时脚本/日志/取证留档），非 lintable 代码面
# （W56：解密证据等以原文件名留档，不因扩展名误入 lint 分母）
extend-exclude = [".workflow"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 行长度由 line-length 控制，不强制折行

[tool.ruff.lint.isort]
known-first-party = ["core", "gui", "models", "training", "labeling", "inference", "exporter", "evaluation"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]

# pytest 配置已收敛至 pytest.ini（W3-T4 单一真源：覆盖率门禁 + uia 排除 + 标记注册）
