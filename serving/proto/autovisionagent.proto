syntax = "proto3";

package autovisionagent.v1;

// C# 生成代码命名空间，与 VisionAgent.Shared 约定一致。
option csharp_namespace = "VisionAgent.Shared.Protos.AutoVisionAgent";

// ===========================================================================
// 共享内存句柄：用于在 gRPC 控制信道之外零拷贝传递大块二进制数据
// （原始图像、分割掩码、关键点数组）。同一机器上的文件映射 MMF。
// ===========================================================================
message SharedMemoryHandle {
  // 内存映射文件绝对路径（同机临时文件，由生产方创建）。
  string file_path = 1;
  // 数据起始偏移（字节）。
  int64 offset = 2;
  // 数据长度（字节）。
  int64 length = 3;
  // 元素 dtype：uint8 / float32 / float64 / bool / bool_rle（掩码游程压缩，
  // int32 小端交替游程、False 起始——W7 起 Python serving 默认、.NET 侧支持解码）
  string dtype = 4;
  // 形状（行优先，例如 [N, H, W, 3]）。
  repeated int32 shape = 5;
  // ---- W19（v3 第三波 FR-2 方向 A）：租约字段（PoC，生产路径未启用）----
  // 客户端对结果区域显式持有租约：服务端在租约未到期期间不回收该区域
  // （TTL reaper 豁免），ReleaseSharedMemory 携带 lease_id 校验归属。
  // serialization 默认路径不填（0）——默认行为不变（ADR-0002）。
  uint64 lease_id = 6;
  // 租约时长（毫秒）；与区域 TTL 是两个独立时钟，取长者保护区域。
  int64 lease_ttl_ms = 7;
}

// W19（v3 第三波 FR-2 方向 B）：大区域流式拉取分块（PoC，生产路径未启用）。
message ArrayChunk {
  bytes data = 1;    // 载荷块（服务端按 1 MiB 切块）
  int64 offset = 2;  // 相对句柄 offset 的字节位移（首块为 0）
  bool last = 3;     // 尾块标记（收齐判定）
}

// ============================== 健康 & 元数据 ============================== #
message PingRequest {}

message PongResponse {
  string server_version = 1;
  bool dispatcher_ready = 2;
  repeated string loaded_tasks = 3;
}

message ListTasksRequest {}

message TaskInfo {
  string task = 1;            // cls/det/seg/pseg/pose/sseg/abdet/sgan/super/zero_shot
  string paradigm = 2;        // zero-shot / supervised
  bool loaded = 3;
  bool requires_training = 4;
}

message ListTasksResponse {
  repeated TaskInfo tasks = 1;
}

message GetTaskInfoRequest {
  string task = 1;
}

// ================================ 模型生命周期 ============================== #
message LoadModelRequest {
  string task = 1;            // 任务类型
  string weights_path = 2;    // 权重绝对路径（同机）
  string device = 3;          // cuda / cpu
}

message LoadModelResponse {
  bool success = 1;
  string error = 2;
}

message UnloadModelRequest {
  string task = 1;
}

message UnloadModelResponse {
  bool success = 1;
  string error = 2;
}

// =================================== 推理 ================================== #
message DetectRequest {
  string task = 1;            // cls/det/seg/pseg/pose/sseg/abdet/sgan/super/zero_shot
  string mode = 2;            // auto / zero_shot / supervised
  float threshold = 3;
  repeated string labels = 4;
  repeated string prompts = 5;  // 零样本提示词
  // 输入图像源（三选一，优先级：image_shm > image_path > image_bytes）
  bytes image_bytes = 10;       // 内联小图（JPEG/PNG/RAW）
  string image_path = 11;       // 同机文件路径
  SharedMemoryHandle image_shm = 12;  // 共享内存大图（RAW uint8，shape=[H,W,C]）
}

message DetectionResultProto {
  string task = 1;
  double score = 2;
  repeated double scores = 3;
  repeated string labels = 4;
  // 检测框扁平化 [x1,y1,x2,y2, x1,y1,x2,y2, ...]，box_count = boxes_flat.size / 4。
  repeated double boxes_flat = 5;
  int32 box_count = 6;
  // 大块数据走共享内存（可选）：
  SharedMemoryHandle masks_shm = 7;     // (N,H,W) bool
  SharedMemoryHandle keypoints_shm = 8; // (N,K,2|3) float
  map<string, string> extra = 9;

  // ---- W17（v3 P1-1）：小数组内联通道 ----
  // 序列化后 < 64 KiB 的 masks/keypoints 直接内联进 proto，不再创建共享内存
  // 区域（结果区域由客户端在 RPC 返回后即读；小载荷内联可省一次文件创建，
  // 且随附客户端无需回收）。消费端规则：inline 字段非空 → 以同名 shm 句柄
  // 字段携带的 dtype/shape 为元数据解码内联字节（句柄 file_path 为空、
  // length 为 0）；否则若句柄 length > 0 → 按句柄走共享内存读取。
  bytes masks_inline = 10;      // bool_rle（默认）或 raw bool 字节
  bytes keypoints_inline = 11;  // raw float32 小端字节
}

message DetectResponse {
  bool success = 1;
  string error = 2;
  DetectionResultProto result = 3;
}

// ============================ 共享内存区域回收 ============================== #
message ReleaseSharedMemoryRequest {
  string file_path = 1;
  // W19（v3 第三波 FR-2 方向 A，PoC）：可选租约 ID；非 0 时服务端校验
  // 归属（lease_id 与该区域的在册租约一致才允许释放），不匹配则
  // success=False。默认路径（0，无租约）行为与 W17 完全一致。
  uint64 lease_id = 2;
}

message ReleaseSharedMemoryResponse {
  bool success = 1;
  string error = 2;
}

// ===========================================================================
// AutoVisionAgent 对外服务。
// 设计：gRPC 作为控制信道（RPC 契约 + 小结果元数据），
//       共享内存作为大块二进制数据的零拷贝通道。
// ===========================================================================
service AutoVisionAgentService {
  // 健康检查。
  rpc Ping(PingRequest) returns (PongResponse);
  // 列出全部任务能力。
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  // 查询单个任务状态。
  rpc GetTaskInfo(GetTaskInfoRequest) returns (TaskInfo);
  // 加载有监督引擎权重。
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
  // 卸载引擎、释放显存。
  rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);
  // 单图推理。
  rpc Detect(DetectRequest) returns (DetectResponse);
  // 回收由本服务创建的共享内存文件。
  rpc ReleaseSharedMemory(ReleaseSharedMemoryRequest) returns (ReleaseSharedMemoryResponse);
  // W19（v3 第三波 FR-2 方向 B，PoC）：按句柄流式拉取共享内存区域
  // （1 MiB ArrayChunk 流；区域不存在/已被回收 → NOT_FOUND abort）。
  // 供无法做同机文件映射的消费端取回大数组；生产路径未启用。
  rpc FetchRegion(SharedMemoryHandle) returns (stream ArrayChunk);
}
